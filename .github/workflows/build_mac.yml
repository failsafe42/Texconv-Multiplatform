# Build a shared library and an executable for macOS
name: build_mac

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIP_NAME: TexconvMultiplatform
jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            flag: ""
            use_libs: false
          - arch: universal
            flag: "--universal"
            use_libs: false
          - arch: arm64
            flag: ""
            use_libs: true
          - arch: universal
            flag: "--universal"
            use_libs: true
        arch: [arm64, universal]
    steps:
      - uses: actions/checkout@v4
      - run: |
          git submodule update --init --recursive --recommend-shallow --depth 1

      - name: build texconv
        if: matrix.use_libs == false
        run: |
          ./build.cmd ${{ matrix.flag }}
          ./build.cmd --build-as-exe ${{ matrix.flag }}

      - name: build texconv with libjpeg and libpng
        if: matrix.use_libs == true
        run: |
          brew install nasm
          ./build.cmd --use-optional-formats ${{ matrix.flag }}
          ./build.cmd --use-optional-formats --build-as-exe  ${{ matrix.flag }}

      - name: Copy files
        run: |
          mkdir -p release/${{ env.ZIP_NAME }}
          cp libtexconv.* release/${{ env.ZIP_NAME }}
          cp texconv release/${{ env.ZIP_NAME }}
          cp texassemble release/${{ env.ZIP_NAME }}
          cp texdiag release/${{ env.ZIP_NAME }}
          cp changelog.txt release/${{ env.ZIP_NAME }}
          cp LICENSE release/${{ env.ZIP_NAME }}
          cp THIRD_PARTY_LICENSES.txt release/${{ env.ZIP_NAME }}
          cd release
          tar -Jcvf ${{ env.ZIP_NAME }}-${{ runner.os }}-${{ matrix.arch }}${{ ((matrix.use_libs == false) && '-no-deps') || '' }}.tar.xz ${{ env.ZIP_NAME }}

      - name: Create Release Draft
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref }}
          body: |
            Changelog
            - First Change
            - Second Change
          draft: true
          prerelease: false

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref }} release/${{ env.ZIP_NAME }}-${{ runner.os }}-${{ matrix.arch }}${{ ((matrix.use_libs == false) && '-no-deps') || '' }}.tar.xz
